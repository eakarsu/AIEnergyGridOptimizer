name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: energy_grid_optimizer }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci --prefix backend
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/migrations/001_governed_grid_plans.sql
        env: { DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/energy_grid_optimizer" }
      - run: npm test --prefix backend
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: bash -n start.sh scripts/*.sh
